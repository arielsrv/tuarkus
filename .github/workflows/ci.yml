name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Cancel superseded runs on the same ref (keeps PR pushes cheap).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (JVM)
    runs-on: ubuntu-latest
    # Needs write to push the regenerated coverage badge back to master. On PRs
    # from forks the token is read-only regardless; the badge steps below are
    # gated to push-to-master, so they simply skip there.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '25'

      # Validates ./gradlew checksum and enables build caching.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      # `build` compiles main + test sources, runs the JVM test suite
      # (src/test) and assembles the Quarkus fast-jar under build/quarkus-app.
      - name: Build and run tests
        run: ./gradlew build

      # Turn build/jacoco-report/jacoco.csv into an SVG badge under .github/badges.
      - name: Generate coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: build/jacoco-report/jacoco.csv
          badges-directory: .github/badges
          generate-branches-badge: false

      # Commit the badge back only when it actually changed, tagging the commit
      # with [skip ci] so this workflow does not retrigger itself in a loop.
      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if [[ -z "$(git status --porcelain .github/badges)" ]]; then
            echo "Coverage badge unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges
          git commit -m "chore: update coverage badge [skip ci]"
          git push origin HEAD:master

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore

      - name: Upload application artifact
        uses: actions/upload-artifact@v7
        with:
          name: quarkus-app
          path: build/quarkus-app/
          if-no-files-found: warn