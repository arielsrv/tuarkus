name: Docker (JVM image)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: docker-jvm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Build JVM container image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      # Dockerfile.jvm copies build/quarkus-app/*, so the fast-jar must exist.
      # `quarkusBuild -x test` assembles it without re-running the JVM suite, which
      # ci.yml already ran on this same commit; this job only smoke-tests packaging.
      - name: Build application
        run: ./gradlew quarkusBuild -x test

      # Verifies the JVM Dockerfile builds cleanly. No push — this is a smoke test.
      - name: Build JVM container image
        run: docker build -f src/main/docker/Dockerfile.jvm -t tuarkus:jvm .