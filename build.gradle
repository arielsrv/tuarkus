plugins {
    id 'java'
    id 'io.quarkus'
    id 'io.github.ben-manes.versions'
}

repositories {
    mavenCentral()
}

// Mockito's inline mock-maker needs a Java agent. If not passed as -javaagent it
// self-attaches at runtime, which the JDK warns about and will disallow in a future
// release. Resolve the mockito-core jar in its own configuration and hand it to the
// test JVM explicitly. Version stays managed by the Quarkus BOM (enforcedPlatform).
configurations {
    mockitoAgent
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-smallrye-openapi'
    implementation 'io.quarkus:quarkus-rest-client-jackson'
    testImplementation 'io.quarkus:quarkus-junit'
    testImplementation 'io.quarkus:quarkus-jacoco'
    testImplementation 'io.quarkus:quarkus-junit5-mockito'
    testImplementation 'io.rest-assured:rest-assured'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    mockitoAgent(enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}"))
    mockitoAgent('org.mockito:mockito-core') { transitive = false }
}

group = 'org.github'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    jvmArgs "-javaagent:${configurations.mockitoAgent.singleFile}"
}

// The native integration tests in src/native-test exercise the compiled binary,
// but `testNative` pulls in a full native compilation — far too slow to hang off
// the default `check`. Opt in with `./gradlew check -Pnative`.
if (providers.gradleProperty('native').isPresent()) {
    tasks.named('check') {
        dependsOn tasks.named('testNative')
    }
}
