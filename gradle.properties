# Gradle properties
quarkusPluginId=io.quarkus
quarkusPluginVersion=3.38.0
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom
quarkusPlatformVersion=3.38.0
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.configuration-cache.parallel=true
# Native builds — prefer the Taskfile wrappers (`task --list`), which assert the
# output format before it reaches a container image.
#
#   ./gradlew buildNative                        (task native:build)
#       Host binary. On macOS a Mach-O executable: runnable locally and by
#       `testNative`, but NOT usable by src/main/docker/Dockerfile.native.
#
#   ./gradlew clean buildNative -Dquarkus.native.container-build=true
#                                                (task native:build:linux)
#       Builds inside the Mandrel builder image, producing the Linux binary that
#       Dockerfile.native expects. Requires a running container runtime.
#       Note: it must be -D, not -P. The Quarkus plugin ignores the -P form for
#       this property and silently builds a host binary instead — which then
#       fails at container startup with 'exec format error'. The `clean` matters
#       too: both modes write the same paths, so a stale host binary can survive
#       a container build.
#       Add -Dquarkus.native.container-runtime-options=--platform=linux/amd64
#       when the deploy target is x86_64 rather than aarch64.
#       Not the default because `testNative` cannot execute a Linux binary on a
#       macOS host.
#
#   ./gradlew check -Pnative                     (task native:test)
#       Runs the native integration tests (src/native-test) against a freshly
#       compiled binary. Off by default: it forces a full native compilation.