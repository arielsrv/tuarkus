# Gradle properties
quarkusPluginId=io.quarkus
quarkusPluginVersion=3.38.0
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom
quarkusPlatformVersion=3.38.0
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.configuration-cache.parallel=true

# Native builds
#
#   ./gradlew buildNative
#       Host binary. On macOS this is a Mach-O executable, runnable locally and
#       by `testNative`, but NOT usable by src/main/docker/Dockerfile.native.
#
#   ./gradlew buildNative -Pquarkus.native.container-build=true
#       Builds inside the Mandrel builder image, producing a Linux binary that
#       matches Dockerfile.native. Requires a running container runtime. Not
#       enabled by default because `testNative` cannot execute a Linux binary
#       on a macOS host. Add -Pquarkus.native.container-runtime-options=--platform=linux/amd64
#       when the deploy target is x86_64.
#
#   ./gradlew check -Pnative
#       Runs the native integration tests (src/native-test) against a freshly
#       compiled binary. Off by default: it forces a full native compilation.