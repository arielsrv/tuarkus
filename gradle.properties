# Gradle properties
quarkusPluginId=io.quarkus
quarkusPluginVersion=3.39.2
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom
quarkusPlatformVersion=3.39.2
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.configuration-cache.parallel=true
benManesPluginId=io.github.ben-manes.versions
benManesPluginVersion=0.61.0
# Task output caching: lets clean builds restore compileJava/test/quarkusBuild
# from cache instead of redoing them (~7x faster locally, and setup-gradle
# persists the cache across CI runs).
org.gradle.caching=true
