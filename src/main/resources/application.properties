# ---------------------------------------------------------------------------
# Native image build tuning (applied by `./gradlew buildNative`)
# ---------------------------------------------------------------------------
# -R:MaxHeapSize     Native Image defaults the max heap to 80% of *host* RAM.
#                    That default ignores container memory limits, so under a
#                    cgroup cap the process grows past the limit and gets
#                    OOM-killed instead of GCing. Bound it explicitly.
# --future-defaults  Opt into the defaults of the next GraalVM release, so any
#                    breakage surfaces now rather than during an upgrade.
quarkus.native.additional-build-args=-R:MaxHeapSize=256m,--future-defaults=all
# Base URL of the reactive REST client (configKey = "gorest")
quarkus.rest-client.gorest.url=https://gorest.co.in
# Swagger UI is dev/test-only by default. Include it in the prod (native) build too so
# the running binary serves it at /q/swagger-ui. Set to false to drop it from prod and
# shave a bit off the native image; the OpenAPI spec at /q/openapi is always available.
quarkus.swagger-ui.always-include=true
# OpenAPI document metadata (shown in the Swagger UI header).
quarkus.smallrye-openapi.info-title=Tuarkus API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Reactive Quarkus service that aggregates users, posts, comments and todos from the GoRest API.
# The global ObjectMapper (snake_case, null omission, ISO dates, lenient parsing) is
# configured in code by org.github.config.ObjectMapperConfig, not here: the
# quarkus.jackson.property-naming-strategy property triggers a reflective Class.forName
# on the strategy that fails in native image.
quarkus.native.builder-image=quay.io/quarkus/ubi10-quarkus-mandrel-builder-image:jdk-25
# HttpStatus holds only compile-time String constants, so javac inlines their values at
# each use site and the class is never loaded at runtime. JaCoCo therefore never records
# it and it shows up as uncovered noise. Exclude it from the coverage report explicitly.
quarkus.jacoco.excludes=**/HttpStatus.class