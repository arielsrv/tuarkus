# ---------------------------------------------------------------------------
# Native image build tuning (applied by `./gradlew buildNative`)
# ---------------------------------------------------------------------------
# -R:MaxHeapSize     Native Image defaults the max heap to 80% of *host* RAM.
#                    That default ignores container memory limits, so under a
#                    cgroup cap the process grows past the limit and gets
#                    OOM-killed instead of GCing. Bound it explicitly.
# --future-defaults  Opt into the defaults of the next GraalVM release, so any
#                    breakage surfaces now rather than during an upgrade.
quarkus.native.additional-build-args=-R:MaxHeapSize=256m,--future-defaults=all
# Base URL of the reactive REST client (configKey = "gorest")
quarkus.rest-client.gorest.url=https://gorest.co.in
# Global ObjectMapper (server + rest-client), equivalent to javalin-api's
# ObjectMapperProvider: snake_case, null fields omitted, ISO dates (no timestamps)
# and no failure on unknown properties. With snake_case, @JsonProperty is not needed.
quarkus.jackson.property-naming-strategy=com.fasterxml.jackson.databind.PropertyNamingStrategies$SnakeCaseStrategy
quarkus.jackson.serialization-inclusion=non-null
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.fail-on-unknown-properties=false
