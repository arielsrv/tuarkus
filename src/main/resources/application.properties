# ---------------------------------------------------------------------------
# Native image build tuning (applied by `./gradlew buildNative`)
# ---------------------------------------------------------------------------
# -R:MaxHeapSize     Native Image defaults the max heap to 80% of *host* RAM.
#                    That default ignores container memory limits, so under a
#                    cgroup cap the process grows past the limit and gets
#                    OOM-killed instead of GCing. Bound it explicitly.
# --future-defaults  Opt into the defaults of the next GraalVM release, so any
#                    breakage surfaces now rather than during an upgrade.
quarkus.native.additional-build-args=-R:MaxHeapSize=256m,--future-defaults=all
quarkus.rest-client.gorest.url=https://gorest.co.in
# ---------------------------------------------------------------------------
# GoRest client tuning
# ---------------------------------------------------------------------------
# Timeouts (ms): without them a hung upstream call blocks the request forever.
# connect-timeout bounds TCP establishment; read-timeout bounds waiting for the
# response once connected.
quarkus.rest-client.gorest.connect-timeout=2000
quarkus.rest-client.gorest.read-timeout=5000
# HTTP/2 multiplexes the fan-out (posts/comments/todos per user) over a single
# connection instead of opening one per in-flight request. connection-pool-size
# caps concurrent connections when the peer falls back to HTTP/1.1.
quarkus.rest-client.gorest.http2=true
quarkus.rest-client.gorest.connection-pool-size=50
# Accept gzip-encoded responses and decompress them, cutting transfer size on
# the (large, JSON) list payloads gorest returns.
quarkus.rest-client.gorest.enable-response-decompression=true
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Tuarkus API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Reactive Quarkus service that aggregates users, posts, comments and todos from the GoRest API.
quarkus.native.builder-image=quay.io/quarkus/ubi10-quarkus-mandrel-builder-image:jdk-25